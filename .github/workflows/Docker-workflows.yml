name: workflow-actions

on:
  push:
    braches: main

jobs:
  build:

    runs-on: ubuntu-lates
    
    steps:
      - name: checkout code
        uses: checkout@v4

      - name: login to docker
        uses: docker/login-action@v3

        with:

        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
  
     - name: docker build
        run: docker run build -t ${{ secrets.DOCKERHUB_USERNAME }}/my-test-app:latest .

     - name: dockerhub push
     run: docker push ${{ secrets.DOCKERHUB_NAME }}/my-html-app:latest
